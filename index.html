<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ôn tập giữa kì 1 – Anh, Hoá, Sinh & Lí 11</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#040711;
  --card:rgba(15,23,42,.74);
  --card-hi:rgba(30,41,59,.82);
  --bd:rgba(148,163,184,.16);
  --txt:#f1f5f9;
  --mut:#94a3b8;
  --acc:#38bdf8;
  --em:#10b981;
  --pk:#ec4899;
  --vi:#8b5cf6;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);
  background:var(--bg);
  overflow-x:hidden;
}

/* COSMIC AURORA BACKGROUND */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-fx::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse at 50% 35%,black 30%,transparent 85%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 35%,black 30%,transparent 85%);
}
.orb{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;
  animation:drift 18s ease-in-out infinite alternate;
}
.orb.o1{width:380px;height:380px;background:#0d9488;top:-90px;left:-80px}
.orb.o2{width:420px;height:420px;background:#4f46e5;top:18%;right:-120px;animation-delay:-6s}
.orb.o3{width:360px;height:360px;background:#be185d;bottom:-100px;left:22%;animation-delay:-12s}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(35px,-28px) scale(1.12)}
}

.w{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 14px 52px}
button{font:inherit;color:inherit;cursor:pointer;transition:all .18s cubic-bezier(.2,.8,.2,1)}

/* TOP NAVBAR */
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(10,16,32,.78);border:1px solid var(--bd);
  border-radius:18px;padding:10px 14px;margin-bottom:14px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 10px 28px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-ic{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;background:linear-gradient(135deg,#0ea5e9,#10b981);
  box-shadow:0 4px 14px rgba(14,165,233,.35);
}
.brand-txt b{display:block;font-size:1.02rem;letter-spacing:-.2px;color:#fff}
.brand-txt small{display:block;font-size:.73rem;color:#7dd3fc}

.prof-pill{
  display:flex;align-items:center;gap:8px;
  background:rgba(30,41,59,.7);border:1px solid rgba(148,163,184,.25);
  border-radius:99px;padding:4px 11px 4px 5px;max-width:190px;
}
.prof-pill:hover{border-color:#38bdf8;background:rgba(30,41,59,.95)}
.prof-av{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;background:linear-gradient(135deg,#0284c7,#7c3aed);flex-shrink:0;overflow:hidden;
}
.av-img-inline{width:100%;height:100%;object-fit:cover;display:block}
.prof-pill span{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* SEGMENTED MODE BAR */
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  background:rgba(9,14,26,.82);border:1px solid var(--bd);
  border-radius:16px;padding:5px;margin-bottom:14px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
}
.seg-b{
  border:0;border-radius:12px;padding:10px 10px;background:transparent;text-align:center;
}
.seg-b b{display:block;font-size:.9rem}
.seg-b small{display:block;font-size:.72rem;color:var(--mut);margin-top:1px}
.seg-b.on-hard{
  background:linear-gradient(135deg,#0284c7,#0d9488);color:#fff;
  box-shadow:0 4px 14px rgba(14,165,233,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.seg-b.on-hard small{color:#e0f2fe}
.seg-b.on-bede{
  background:linear-gradient(135deg,#db2777,#7c3aed);color:#fff;
  box-shadow:0 4px 14px rgba(219,39,119,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.seg-b.on-bede small{color:#fce7f3}

/* GLASS CARD */
.c{
  background:linear-gradient(165deg,var(--card-hi) 0%,var(--card) 100%);
  border:1px solid var(--bd);
  border-top-color:rgba(255,255,255,.18);
  border-radius:20px;padding:16px;margin-bottom:14px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 16px 34px -12px rgba(2,6,23,.85),inset 0 1px 0 rgba(255,255,255,.08);
}

/* HERO SOLO ARENA BANNER */
.arena{
  background:linear-gradient(135deg,rgba(30,27,75,.88) 0%,rgba(88,28,135,.55) 55%,rgba(157,23,77,.45) 100%);
  border:1px solid rgba(236,72,153,.4);
  box-shadow:0 14px 32px -10px rgba(168,85,247,.35),inset 0 1px 1px rgba(255,255,255,.2);
}
.arena-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.arena-tag{
  font-size:.72rem;font-weight:800;letter-spacing:.8px;padding:4px 10px;border-radius:99px;
  background:linear-gradient(90deg,#ec4899,#8b5cf6);color:#fff;
}
.arena-sub{font-size:.84rem;color:#e2e8f0;margin:0 0 12px;line-height:1.45}
.arena-acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.abtn{
  border:0;border-radius:13px;padding:11px 12px;font-weight:700;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.abtn.pri{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;box-shadow:0 6px 18px rgba(236,72,153,.35)}
.abtn.sec{background:rgba(15,23,42,.75);border:1px solid rgba(244,114,182,.35);color:#fbcfe8}
.abtn:hover{filter:brightness(1.1);transform:translateY(-1.5px)}

/* BENTO 2x2 SUBJECT GRID */
.sec-lbl{
  font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:#94a3b8;margin:4px 2px 10px;display:flex;align-items:center;justify-content:space-between;
}
.bento{display:grid;grid-template-columns:1fr;gap:11px;margin-bottom:14px}
@media(min-width:540px){.bento{grid-template-columns:1fr 1fr}}
.sj-card{
  display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  text-align:left;padding:16px;border-radius:20px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(30,41,59,.82),rgba(15,23,42,.92));
  border:1px solid rgba(148,163,184,.18);border-top-color:rgba(255,255,255,.2);
  box-shadow:0 12px 26px -10px rgba(0,0,0,.75);
}
.sj-card:hover{transform:translateY(-3px);border-color:var(--ac,#38bdf8);box-shadow:0 16px 32px -10px rgba(14,165,233,.28)}
.sj-card:active{transform:translateY(1px)}
.sj-row{display:flex;align-items:center;gap:12px}
.sj-ic{
  width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:1.55rem;flex-shrink:0;
  background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);
}
.sj-title b{display:block;font-size:1.06rem;color:#fff}
.sj-title small{display:block;font-size:.76rem;color:#94a3b8;margin-top:2px}
.sj-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:9px;border-top:1px solid rgba(148,163,184,.12);font-size:.78rem;
}
.sj-best{color:#fbbf24;font-weight:700}
.sj-cnt{
  background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.28);
  padding:3px 10px;border-radius:99px;font-weight:700;
}

/* LEADERBOARD */
.rank-card{
  background:linear-gradient(155deg,rgba(15,23,42,.92),rgba(6,78,59,.36));
  border:1px solid rgba(52,211,153,.32);
}
.rank-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rank-badge{
  font-size:.74rem;font-weight:800;letter-spacing:.7px;padding:4px 10px;border-radius:99px;
  background:linear-gradient(90deg,#059669,#0284c7);color:#fff;
}
.live-dot{
  font-size:.76rem;font-weight:700;color:#6ee7b7;
  background:rgba(6,95,70,.45);padding:4px 10px;border-radius:99px;border:1px solid rgba(52,211,153,.3);
}
.rank-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.rank-chip{
  border:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.75);
  border-radius:10px;padding:6px 11px;font-size:.77rem;font-weight:600;color:#cbd5e1;white-space:nowrap;
}
.rank-chip.on{background:linear-gradient(135deg,#059669,#0284c7);color:#fff;border-color:#34d399}
.rank-list{display:flex;flex-direction:column;gap:7px}
.rank-item{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:13px;
  background:rgba(15,23,42,.75);border:1px solid rgba(148,163,184,.14);
}
.rank-item.top1{border-color:#fbbf24;background:linear-gradient(145deg,rgba(113,63,18,.35),rgba(15,23,42,.85))}
.rank-item.top2{border-color:#94a3b8}
.rank-item.top3{border-color:#d97706}
.rank-pos{width:26px;font-size:1rem;font-weight:900;text-align:center;color:#94a3b8;flex-shrink:0}
.rank-item.top1 .rank-pos{color:#fde047;font-size:1.18rem}
.rank-av{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;background:rgba(30,41,59,.9);border:1px solid rgba(255,255,255,.14);flex-shrink:0;overflow:hidden;
}
.rank-info{flex:1;overflow:hidden}
.rank-name{font-size:.85rem;font-weight:700;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-sub{font-size:.72rem;color:#94a3b8}
.rank-score{font-size:1rem;font-weight:800;color:#34d399;text-align:right;white-space:nowrap}
.rank-score small{display:block;font-size:.66rem;color:#94a3b8;font-weight:500}

/* CHIPS & BUTTONS */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{
  border:1px solid rgba(148,163,184,.25);background:rgba(15,23,42,.78);
  border-radius:12px;padding:9px 14px;font-size:.88rem;font-weight:500;color:#cbd5e1;
}
.chip.on{
  background:linear-gradient(135deg,#0284c7,#0d9488);color:#fff;
  border-color:rgba(125,211,252,.5);box-shadow:0 4px 14px rgba(14,165,233,.35);
}
.go,.nx{
  background:linear-gradient(135deg,#0ea5e9 0%,#0d9488 100%);
  border:1px solid rgba(125,211,252,.4);border-bottom:3px solid #0f766e;
  border-radius:14px;padding:13px;width:100%;font-weight:700;font-size:1rem;color:#fff;
  box-shadow:0 8px 22px -6px rgba(14,165,233,.45);
}
.nx.bede{
  background:linear-gradient(135deg,#ec4899 0%,#8b5cf6 100%);
  border-color:rgba(244,114,182,.5);border-bottom-color:#6d28d9;
}
.go:active,.nx:active{transform:translateY(2px);border-bottom-width:1px}
.back{
  background:rgba(30,41,59,.75);border:1px solid rgba(148,163,184,.22);
  color:#7dd3fc;padding:7px 14px;border-radius:99px;margin-bottom:10px;font-weight:600;font-size:.86rem;
}

/* QUIZ ARENA */
.top{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  font-size:.84rem;color:#cbd5e1;gap:8px;
  background:rgba(10,16,32,.82);border:1px solid var(--bd);
  padding:8px 13px;border-radius:13px;
}
.bar{
  height:8px;background:rgba(9,14,26,.9);border-radius:99px;overflow:hidden;
  margin:9px 0 14px;padding:1.5px;
}
.bar i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#38bdf8,#10b981);transition:width .35s ease;
}
.bar i.bede{background:linear-gradient(90deg,#f472b6,#a855f7,#38bdf8)}
.q{font-size:1.08rem;line-height:1.58;margin:0 0 15px;white-space:pre-line;color:#f8fafc;font-weight:500}
.o{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:linear-gradient(170deg,rgba(36,49,70,.75) 0%,rgba(17,26,43,.9) 100%);
  border:1px solid rgba(148,163,184,.2);border-bottom:3px solid rgba(6,10,20,.85);
  border-radius:14px;padding:12px 14px;margin-bottom:9px;min-height:50px;line-height:1.45;
}
.o:hover{border-color:rgba(56,189,248,.45);transform:translateY(-1px)}
.o:active{transform:translateY(2px);border-bottom-width:1px}
.k{
  width:29px;height:29px;border-radius:9px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.88rem;color:#7dd3fc;
  background:rgba(10,16,32,.85);border:1px solid rgba(125,211,252,.25);
}
.ot{flex:1;color:#e2e8f0}
.o.ok{background:linear-gradient(165deg,rgba(6,95,70,.68),rgba(4,47,46,.88));border-color:#10b981;border-bottom-color:#065f46}
.o.ok .k{background:#10b981;color:#022c22;border-color:#6ee7b7}
.o.no{background:linear-gradient(165deg,rgba(127,29,29,.68),rgba(69,10,10,.88));border-color:#ef4444;border-bottom-color:#7f1d1d}
.o.no .k{background:#ef4444;color:#fff;border-color:#fca5a5}

@keyframes popIn{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
.fb{
  border-radius:15px;padding:13px 15px;margin:12px 0;text-align:center;
  background:linear-gradient(165deg,rgba(127,29,29,.45),rgba(69,10,10,.65));
  border:1.5px solid rgba(239,68,68,.6);line-height:1.5;
  animation:popIn .22s cubic-bezier(.2,1.2,.3,1);
}
.fb.ok-fb{background:linear-gradient(165deg,rgba(6,95,70,.5),rgba(4,47,46,.72));border-color:#10b981}
.r-img{
  width:155px;height:155px;object-fit:cover;border-radius:15px;
  display:block;margin:9px auto 6px;border:2px solid rgba(255,255,255,.28);
  box-shadow:0 8px 22px rgba(0,0,0,.55);
}

/* ĐÚNG / SAI & TRẢ LỜI NGẮN */
.ds-item{
  background:rgba(15,23,42,.75);border:1px solid rgba(148,163,184,.18);
  border-radius:14px;padding:12px;margin-bottom:9px;
}
.ds-item.ok{border-color:#10b981;background:rgba(6,95,70,.3)}
.ds-item.no{border-color:#ef4444;background:rgba(127,29,29,.3)}
.ds-txt{margin:0 0 9px;line-height:1.46;color:#e2e8f0}
.ds-btns{display:flex;gap:8px}
.ds-b{
  flex:1;padding:8px;border-radius:10px;border:1px solid rgba(148,163,184,.25);
  background:rgba(10,16,32,.7);font-weight:600;color:#cbd5e1;
}
.ds-b.sel{background:linear-gradient(135deg,#0284c7,#0d9488);border-color:#7dd3fc;color:#fff}
.ds-b.ans{outline:2px solid #10b981}
.sa-wrap{display:flex;gap:8px;margin:10px 0 6px}
.sa-in{
  flex:1;background:rgba(9,14,26,.88);border:1.5px solid rgba(148,163,184,.28);
  border-radius:12px;padding:12px 14px;color:#fff;font-size:1.02rem;outline:none;
}
.sa-in:focus{border-color:#38bdf8}
.sa-in.ok{border-color:#10b981;background:rgba(6,95,70,.35)}
.sa-in.no{border-color:#ef4444;background:rgba(127,29,29,.35)}
.sa-btn{
  background:linear-gradient(135deg,#0ea5e9,#0d9488);border:0;
  border-radius:12px;padding:0 20px;font-weight:700;color:#fff;
}
.badge{
  display:inline-block;font-size:.74rem;padding:4px 10px;border-radius:99px;
  background:rgba(14,165,233,.16);border:1px solid rgba(56,189,248,.35);
  color:#7dd3fc;margin-bottom:9px;font-weight:600;
}
.badge.bede{background:rgba(236,72,153,.18);border-color:rgba(244,114,182,.45);color:#f9a8d4}

/* SOLO HUD */
.pvp-hud{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  background:rgba(9,14,26,.9);border:1px solid rgba(148,163,184,.2);border-radius:16px;
  padding:10px 12px;margin-bottom:12px;
}
.pvp-user{display:flex;align-items:center;gap:9px}
.pvp-user.opp{flex-direction:row-reverse;text-align:right}
.pvp-av-hud{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.45rem;background:rgba(30,41,59,.85);border:1.5px solid rgba(255,255,255,.2);flex-shrink:0;overflow:hidden;
}
.pvp-meta{display:flex;flex-direction:column;flex:1;overflow:hidden}
.pvp-name{font-size:.8rem;font-weight:700;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvp-score{font-size:1.2rem;font-weight:800}
.pvp-user.me .pvp-score{color:#38bdf8}
.pvp-user.opp .pvp-score{color:#ec4899}
.pvp-bar{height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:2px}
.pvp-bar i{display:block;height:100%;transition:width .25s ease-out}
.pvp-bar.me i{background:#38bdf8}
.pvp-bar.opp i{background:#ec4899;margin-left:auto}
.pvp-vs{font-size:1.05rem;font-weight:900;color:#fbbf24}
.pvp-noti{
  font-size:.8rem;text-align:center;color:#fbcfe8;padding:6px;border-radius:10px;
  background:rgba(236,72,153,.14);border:1px dashed rgba(236,72,153,.35);margin-bottom:10px;
}

/* FOOTER UTILS */
.util-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.util-grid{grid-template-columns:1.1fr .9fr}}
.img-cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.img-box{
  background:rgba(9,14,26,.65);border:1px dashed rgba(148,163,184,.32);
  border-radius:13px;padding:9px;text-align:center;font-size:.78rem;
}
.img-box img{width:62px;height:62px;object-fit:cover;border-radius:9px;display:block;margin:5px auto}
.img-box label{
  display:inline-block;margin-top:3px;padding:4px 9px;border-radius:8px;
  background:rgba(14,165,233,.2);border:1px solid rgba(56,189,248,.4);
  color:#7dd3fc;font-weight:600;cursor:pointer;font-size:.74rem;
}
.dn{text-align:center;border-color:rgba(250,204,21,.28)}
.dn h2{margin:0 0 4px;font-size:1rem;color:#fde047}
.dn p{margin:3px 0;color:#cbd5e1;font-size:.82rem}
.dn .stk{
  display:inline-block;padding:5px 14px;border-radius:10px;
  background:rgba(9,14,26,.75);border:1px solid rgba(56,189,248,.25);
  font-size:1.25rem;font-weight:800;letter-spacing:1.2px;color:#38bdf8;margin:6px 0;
}
.dn button{
  border:1px solid rgba(250,204,21,.45);background:rgba(250,204,21,.1);
  border-radius:99px;padding:6px 14px;margin-top:4px;font-weight:600;color:#fef08a;font-size:.8rem;
}
.av-preview-box{
  display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:12px;
  background:rgba(9,14,26,.65);border-radius:16px;border:1px dashed rgba(148,163,184,.3);
}
.av-preview-box .prof-av{width:60px;height:60px;border-radius:16px;font-size:2rem}
.upload-btn-label{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#0ea5e9,#0d9488);color:#fff;
  padding:8px 14px;border-radius:11px;font-size:.82rem;font-weight:700;cursor:pointer;
}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 16px}
.av-opt{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;background:rgba(15,23,42,.75);border:1.5px solid rgba(148,163,184,.2);
}
.av-opt.sel{border-color:#38bdf8;background:rgba(14,165,233,.25)}

Câu 4 (Đúng/Sai): Khi nghiên cứu dao động điều hòa trên một đường thẳng, học sinh dùng đồ thị li độ theo thời gian x(t).|Trục thời gian cho biết thời điểm, còn trục li độ cho biết vị trí đại số của vật so với vị trí cân bằng.|Đường cong hình sin trên đồ thị x(t) chính là quỹ đạo hình sin của vật trong không gian.|Trên đoạn đồ thị nằm dưới trục thời gian và đi lên về phía trục đó, vật chuyển động theo chiều âm, ra xa vị trí cân bằng.|Hai lần liên tiếp đồ thị cắt đường x = 0 ứng với vật qua vị trí cân bằng theo hai chiều ngược nhau, nên trạng thái dao động chưa lặp lại.|ĐSSĐ
Câu 5 (Đúng/Sai): Một con lắc dao động trong môi trường có lực cản và không được cung cấp thêm năng lượng. Quan sát thấy biên độ giảm dần.|Dao động có biên độ giảm dần theo thời gian được gọi là dao động tắt dần.|Trong dao động tắt dần không được cung cấp thêm năng lượng, cơ năng luôn được bảo toàn.|Cơ năng giảm không có nghĩa năng lượng biến mất, vì năng lượng được chuyển sang nội năng và các dạng khác.|Với cùng trạng thái ban đầu, nếu giảm lực cản và hệ vẫn dao động thì dao động kéo dài hơn.|ĐSĐĐ
Câu 6 (Đúng/Sai): Dao động tắt dần là dao động có đặc điểm:|Tần số giảm dần theo thời gian.|Cơ năng giảm dần theo thời gian.|Biên độ dao động giảm dần theo thời gian.|Ma sát và lực cản càng lớn thì dao động tắt dần càng nhanh.|SĐĐĐ
Câu 7 (Đúng/Sai): Tìm hiểu về ứng dụng của dao động cưỡng bức. Hãy đọc các nhận định sau và xác định Đúng hay Sai:|Khi một võng điện được bật để đung đưa đều đặn, võng thực hiện dao động cưỡng bức với tần số bằng tần số của motor điện.|Khi một vật dao động cưỡng bức, tần số dao động luôn bằng tần số riêng của vật đó.|Dao động của thân xe buýt khi xe nổ máy tại bến xe là dao động cưỡng bức, do lực dao động tuần hoàn từ động cơ gây ra.|Dao động cưỡng bức chỉ xuất hiện khi có ngoại lực tác động liên tục và có tính tuần hoàn vào hệ dao động.|ĐSĐĐ
Câu 8 (Đúng/Sai): Tìm hiểu về hiện tượng cộng hưởng xảy ra trong cuộc sống và đánh giá lợi/hại:|Hộp đàn ghi ta giúp khuếch đại âm thanh từ dây đàn nhờ hiện tượng cộng hưởng, đây là một ví dụ có hại cần tránh.|Cộng hưởng có thể gây hại nếu không được kiểm soát, ví dụ như cầu bị sập do đoàn người bước đều gây rung động cộng hưởng.|Trong lò vi sóng, cộng hưởng giữa sóng điện từ và phân tử nước giúp truyền năng lượng hiệu quả, làm nóng thức ăn – đó là một ứng dụng có lợi.|Khi âm thanh phát ra từ loa có tần số trùng với tần số riêng của li thủy tinh, li có thể vỡ do cộng hưởng làm biên độ dao động tăng mạnh.|SĐĐĐ
`);

  imgNo=localStorage.getItem("custom_img_no")||"1000272142.jpg";
}catch(e){}

function upImg(type,input){
  const f=input.files&&input.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas"),max=360;
      let w=img.width,h=img.height;
      if(w>h&&w>max){h*=max/w;w=max}else if(h>max){w*=max/h;h=max}
      c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      const d=c.toDataURL("image/jpeg",.82);
      if(type==="ok"){imgOk=d;try{localStorage.setItem("custom_img_ok",d)}catch(err){}}
      else{imgNo=d;try{localStorage.setItem("custom_img_no",d)}catch(err){}}
      home();
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function chooseAv(a){
  curSelAv=a;

  const preview=document.getElementById("prof_av_preview");

function upUserAv(input){
  const f=input.files&&input.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas"),size=96;
      c.width=size;c.height=size;
      const ctx=c.getContext("2d");
      const minDim=Math.min(img.width,img.height);
      const sx=(img.width-minDim)/2;
      const sy=(img.height-minDim)/2;
      ctx.drawImage(img,sx,sy,minDim,minDim,0,0,size,size);
      const d=c.toDataURL("image/jpeg",0.75);
      curSelAv=d;
      document.querySelectorAll(".av-opt").forEach(el=>el.classList.remove("sel"));
      const preview=document.getElementById("prof_av_preview");
      if(preview) preview.innerHTML=renderAv(d);
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);
}

const DEFAULT_LEADERBOARD=[
  {name:"Trần Nguyên Hoàng",av:"👑",score:87,sub:"Sinh học 11",time:Date.now()-600000},
  {name:"Học Bá Chuyên Hoá",av:"⚗️",score:61,sub:"Hoá học 11",time:Date.now()-1800000},
  {name:"Nguyễn Vũ Phong",av:"⚡",score:58,sub:"Vật lí 11",time:Date.now()-3600000},
  {name:"Trần Mai Linh",av:"🇬🇧",score:55,sub:"Tiếng Anh 11",time:Date.now()-7200000},
  {name:"Đỗ Duy Nam",av:"🐉",score:50,sub:"Solo 1v1",time:Date.now()-14400000}
];

let globalLeaderboard=[];
try{
  const cached=localStorage.getItem("nhquiz_leaderboard_cache");
  globalLeaderboard=cached?JSON.parse(cached):DEFAULT_LEADERBOARD;
}catch(e){
  globalLeaderboard=DEFAULT_LEADERBOARD;
}

let activeFilter="all",hubPeer=null,onlinePeersCount=1;

function timeAgo(ts){
  const diff=Math.floor((Date.now()-ts)/1000);
  if(diff<60) return "vừa xong";
  if(diff<3600) return Math.floor(diff/60)+" phút trước";
  if(diff<86400) return Math.floor(diff/3600)+" giờ trước";
  return Math.floor(diff/86400)+" ngày trước";
}

function saveAndBroadcastScore(subTitle,scored){
  if(!scored||scored<=0)return;
  const newEntry={name:myProfile.name,av:myProfile.av,score:scored,sub:subTitle,time:Date.now()};
  const exIdx=globalLeaderboard.findIndex(e=>e.name===myProfile.name&&e.sub===subTitle);
  if(exIdx!==-1){
    if(scored>globalLeaderboard[exIdx].score) globalLeaderboard[exIdx]=newEntry;
  }else{
    globalLeaderboard.push(newEntry);
  }
  globalLeaderboard.sort((a,b)=>b.score-a.score);
  globalLeaderboard=globalLeaderboard.slice(0,30);
  try{localStorage.setItem("nhquiz_leaderboard_cache",JSON.stringify(globalLeaderboard))}catch(e){}

  if(hubPeer){
    try{
      if(hubPeer.hubConns) hubPeer.hubConns.forEach(c=>{if(c.open)c.send({t:"lb_sync",list:globalLeaderboard,online:onlinePeersCount})});
      if(hubPeer.clientConn&&hubPeer.clientConn.open) hubPeer.clientConn.send({t:"lb_post",entry:newEntry});
    }catch(err){}
  }
}

function initLeaderboardSwarm(){
  if(hubPeer)return;
  const HUB_ID="nhquiz_leaderboard_hub_11";
  const tryHost=new Peer(HUB_ID);
  tryHost.hubConns=[];
  tryHost.on('open',()=>{
    hubPeer=tryHost;
    onlinePeersCount=1;
    updateOnlineBadge();
    tryHost.on('connection',c=>{
      tryHost.hubConns.push(c);
      onlinePeersCount=tryHost.hubConns.filter(x=>x.open).length+1;
      updateOnlineBadge();
      c.on('open',()=>c.send({t:"lb_sync",list:globalLeaderboard,online:onlinePeersCount}));
      c.on('data',d=>{
        if(d.t==="lb_post"&&d.entry) saveAndBroadcastScore(d.entry.sub,d.entry.score);
      });
      c.on('close',()=>{
        tryHost.hubConns=tryHost.hubConns.filter(x=>x!==c);
        onlinePeersCount=tryHost.hubConns.filter(x=>x.open).length+1;
        updateOnlineBadge();
      });
    });
  });

  tryHost.on('error',()=>{
    try{tryHost.destroy()}catch(e){}
    const client=new Peer();
    client.on('open',()=>{
      hubPeer=client;
      const connToHub=client.connect(HUB_ID,{reliable:true});
      client.clientConn=connToHub;
      connToHub.on('data',d=>{
        if(d.t==="lb_sync"&&Array.isArray(d.list)){
          globalLeaderboard=d.list;
          try{localStorage.setItem("nhquiz_leaderboard_cache",JSON.stringify(globalLeaderboard))}catch(e){}
          if(d.online) onlinePeersCount=d.online;
          updateOnlineBadge();
          renderLeaderboardList();
        }
      });
    });
  });
}

function updateOnlineBadge(){
  const el=document.getElementById("online_cnt");
  if(el) el.textContent=Math.max(1,onlinePeersCount);
}

function setRankFilter(f){
  activeFilter=f;
  document.querySelectorAll(".rank-chip").forEach(c=>c.classList.remove("on"));
  const btn=document.getElementById("rf_"+f);
  if(btn) btn.classList.add("on");
  renderLeaderboardList();
}

function renderLeaderboardList(){
  const box=document.getElementById("rank_list_box");
  if(!box)return;
  let items=[...globalLeaderboard];
  if(activeFilter==="sinh") items=items.filter(x=>x.sub.includes("Sinh"));
  else if(activeFilter==="hoa") items=items.filter(x=>x.sub.includes("Hoá"));
  else if(activeFilter==="li") items=items.filter(x=>x.sub.includes("Vật lí"));
  else if(activeFilter==="en") items=items.filter(x=>x.sub.includes("Tiếng Anh"));
  else if(activeFilter==="solo") items=items.filter(x=>x.sub.includes("Solo"));

  if(items.length===0){
    box.innerHTML=`<div style="text-align:center;padding:16px;color:#94a3b8;font-size:.84rem">Chưa có ai ghi danh bảng này. Hãy là người đầu tiên leo Top! 🚀</div>`;
    return;
  }

  box.innerHTML=items.slice(0,8).map((it,idx)=>{
    const topCls=idx===0?"top1":idx===1?"top2":idx===2?"top3":"";
    const posIcon=idx===0?"🥇":idx===1?"🥈":idx===2?"🥉":`#${idx+1}`;
    return `<div class="rank-item ${topCls}">
      <div class="rank-pos">${posIcon}</div>
      <div class="rank-av">${renderAv(it.av)}</div>
      <div class="rank-info">
        <div class="rank-name">${esc(it.name)}</div>
        <div class="rank-sub">${esc(it.sub)} · ${timeAgo(it.time||Date.now())}</div>
      </div>
      <div class="rank-score">${it.score}<small>câu đúng</small></div>
    </div>`;
  }).join("");
}

function getSubjectPool(subKey){
  if(subKey==="en") return [...U1,...U2,...U3];
  if(subKey==="hoa") return [...HP1,...HP2,...HP3];
  if(subKey==="sinh") return [...SB1,...SB23,...SHH,...SDS,...SSA];
  if(subKey==="li") return [...LP1,...LP2];
  return [...U1,...U2,...U3,...HP1,...SB1,...SB23,...SHH,...LP1];
}

function generateQuestionIndices(subKey,count){
  const pool=getSubjectPool(subKey);
  const arr=[...Array(pool.length).keys()];
  return sh(arr).slice(0,Math.min(count,pool.length));
}
function buildQuestionsFromIndices(subKey,indices){
  const pool=getSubjectPool(subKey);
  return indices.map(idx=>pool[idx]);
}

function setupConnEvents(c,isHost){
  c.on('open',()=>{
    if(!isHost) c.send({t:"client_join",name:myProfile.name,av:myProfile.av});
  });
  c.on('data',data=>{
    if(isHost&&data.t==="client_join"){
      oppProfile={name:data.name||"Đối thủ",av:data.av||"🥷"};
      const idxs=generateQuestionIndices(soloSubject,soloNum);
      c.send({t:"game_start",s:soloSubject,ids:idxs,name:myProfile.name,av:myProfile.av});
      startSoloGame(buildQuestionsFromIndices(soloSubject,idxs),oppProfile,false);
    }else if(!isHost&&data.t==="game_start"){
      oppProfile={name:data.name||"Chủ phòng",av:data.av||"👑"};
      startSoloGame(buildQuestionsFromIndices(data.s,data.ids),oppProfile,false);
    }else if(data.t==="prog"){
      oppScore=data.score;oppIndex=data.i;
      oppNoti=data.ok?`⚡ ${oppProfile.name} vừa đúng câu ${data.i}!`:`❌ ${oppProfile.name} vừa sai câu ${data.i}!`;
      updateSoloHUD();
    }else if(data.t==="end"){
      oppFinished=true;oppScore=data.score;
      oppNoti=`🏁 ${oppProfile.name} đã hoàn thành bài!`;
      updateSoloHUD();
    }
  });
}

function startMatchmaking(){
  app.innerHTML=`<div class="c arena" style="text-align:center;padding:30px 16px">
    <div style="font-size:2.6rem;margin-bottom:8px">📡</div>
    <h2 style="margin:0 0 8px;color:#fbcfe8">Đang tìm đối thủ cùng sảnh...</h2>

  </div>`;
  if(peer){try{peer.destroy()}catch(e){}peer=null}
  const lobbyId="nhquiz_quick_lobby_11";
  const tempPeer=new Peer();
  let matched=false;
  tempPeer.on('open',()=>{
    const c=tempPeer.connect(lobbyId,{reliable:true});
    const timer=setTimeout(()=>{
      if(!matched){
        try{c.close()}catch(e){}
        try{tempPeer.destroy()}catch(e){}
        becomeLobbyHost(lobbyId);
      }
    },1800);
    c.on('open',()=>{matched=true;clearTimeout(timer);peer=tempPeer;conn=c;setupConnEvents(conn,false)});
    c.on('error',()=>{if(!matched){clearTimeout(timer);try{tempPeer.destroy()}catch(e){}becomeLobbyHost(lobbyId)}});
  });
  tempPeer.on('error',()=>{if(!matched){try{tempPeer.destroy()}catch(e){}becomeLobbyHost(lobbyId)}});
}

function becomeLobbyHost(lobbyId){
  if(peer){try{peer.destroy()}catch(e){}peer=null}
  peer=new Peer(lobbyId);
  let botTmr=setTimeout(()=>{
    if(!conn||!conn.open){
      const randAv=AV_LIST[Math.floor(Math.random()*AV_LIST.length)];
      const randName="Học sinh 11 ("+(["Đắk Lắk","Hà Nội","TP.HCM","Đà Nẵng","Cần Thơ"][Math.floor(Math.random()*5)])+")";
      const idxs=generateQuestionIndices(soloSubject,soloNum);
      startSoloGame(buildQuestionsFromIndices(soloSubject,idxs),{name:randName,av:randAv},true);
    }
  },4200);
  peer.on('connection',c=>{clearTimeout(botTmr);conn=c;setupConnEvents(conn,true)});
  peer.on('error',()=>{
    clearTimeout(botTmr);
    const randAv=AV_LIST[Math.floor(Math.random()*AV_LIST.length)];
    const idxs=generateQuestionIndices(soloSubject,soloNum);
    startSoloGame(buildQuestionsFromIndices(soloSubject,idxs),{name:"Chiến thần 11",av:randAv},true);
  });
}

function startSoloGame(questions,opponent,isBot){
  clearTimeout(tmr);clearInterval(soloBotTmr);
  isSolo=true;Q=questions;i=0;score=0;lock=0;tries++;
  oppScore=0;oppIndex=0;oppFinished=false;oppNoti="";oppProfile=opponent;
  if(isBot){
    soloBotTmr=setInterval(()=>{
      if(oppFinished||!isSolo)return;
      oppIndex++;
      const isOk=Math.random()<0.82;
      if(isOk) oppScore++;
      oppNoti=isOk?`⚡ ${oppProfile.name} vừa đúng câu ${oppIndex}!`:`❌ ${oppProfile.name} vừa sai câu ${oppIndex}!`;
      if(oppIndex>=Q.length){oppFinished=true;oppNoti=`🏁 ${oppProfile.name} đã hoàn thành bài!`;clearInterval(soloBotTmr)}
      updateSoloHUD();
    },Math.floor(2200+Math.random()*1800));
  }
  show();
}

function sendSoloProg(isOk){
  if(conn&&conn.open) try{conn.send({t:"prog",score:score,i:i+1,ok:isOk})}catch(e){}
}

function updateSoloHUD(){
  const mySc=document.getElementById("pvp_my_sc"),opSc=document.getElementById("pvp_opp_sc");
  const myB=document.getElementById("pvp_my_b"),opB=document.getElementById("pvp_opp_b");
  const noti=document.getElementById("pvp_noti");
  if(mySc) mySc.textContent=score;
  if(opSc) opSc.textContent=oppScore;
  if(myB) myB.style.width=(i/Q.length*100)+"%";
  if(opB) opB.style.width=(oppIndex/Q.length*100)+"%";
  if(noti&&oppNoti) noti.innerHTML=esc(oppNoti);
}

  const ks=Object.keys(S[sub].g);
  const selCnt=ks.filter(g=>sel.has(g)).reduce((n,g)=>n+S[sub].g[g].length,0);
  app.innerHTML=`<button class="back" onclick="home()">← Về sảnh chính</button>
  <h1 class="pg-t">${S[sub].ic} ${S[sub].n}</h1>
  ${modeBar(true)}

    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Chọn chuyên đề / dạng bài</b>
      <button class="prof-btn" onclick="selAll()">Chọn tất cả</button>
    </div>
    <div class="chips">${ks.map(g=>`<button class="chip ${sel.has(g)?"on":""}" onclick="tog('${g}')">${g} (${S[sub].g[g].length})</button>`).join("")}</div>
    <div class="s" style="margin:0 0 14px">🏆 Kỷ lục cá nhân: <b>${gb()}</b> câu · Đã chọn: <b>${selCnt}</b> câu</div>
    <button class="go ${mode==="bede"?"nx bede":""}" onclick="start()">Bắt đầu làm bài (${selCnt} câu)</button>
  </div>`;
}
function selAll(){sel=new Set(Object.keys(S[sub].g));setup()}
function tog(g){sel.has(g)?(sel.size>1&&sel.delete(g)):sel.add(g);setup()}
function start(){
  clearTimeout(tmr);clearInterval(soloBotTmr);isSolo=false;
  Q=sh(Object.keys(S[sub].g).filter(g=>sel.has(g)).flatMap(g=>S[sub].g[g]));
  i=0;score=0;lock=0;tries++;show();
}
function cont(){
  clearTimeout(tmr);
  if(i>=Q.length-1)end();
  else{i++;lock=0;show()}
}
function nextOrEnd(){
  score++;
  if(!isSolo) sb(score);
  if(isSolo) sendSoloProg(true);
  const fb=document.getElementById("fb");
  if(fb){
    fb.innerHTML=`<div class="fb ok-fb">🎉 <b>Chúc mừng! Đáp án chính xác!</b><img class="r-img" src="${imgOk}" alt="Chúc mừng" onerror="this.style.display='none'"><small style="color:#a7f3d0">Đang chuyển sang câu tiếp theo...</small></div>`;
    fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  tmr=setTimeout(()=>cont(),1150);
}

  if(!isSolo) sb(score);
  if(isSolo) sendSoloProg(false);
  const fb=document.getElementById("fb");
  const imgTag=`<img class="r-img" src="${imgNo}" alt="Sai rồi" onerror="this.style.display='none'">`;
  if(isSolo||mode==="bede"){
    const isLast=(i===Q.length-1);
    fb.innerHTML=`<div class="fb no-fb">${msgHtml}${imgTag}${isSolo?"⚔️ <b>Đấu Solo:</b> Tiếp tục đua tốc độ nào!":"💅 <b>Chế độ Bê Đê:</b> Vẫn giữ nguyên điểm!"}</div><button class="nx ${isSolo?'':'bede'}" onclick="cont()">${isLast?"Xem tổng kết 🏁":"Làm tiếp câu sau ➡️"}</button>`;
  }else{
    fb.innerHTML=`<div class="fb no-fb">${msgHtml}${imgTag}Bạn đã vượt qua <b>${score}</b> câu liên tiếp.</div><button class="nx" onclick="start()">Làm lại từ đầu 🔁</button>`;
  }
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function show(){
  lock=0;
  const q=Q[i];
  let head="";
  if(isSolo){
    head=`<div class="pvp-hud">
      <div class="pvp-user me">
        <div class="pvp-av-hud">${renderAv(myProfile.av)}</div>
        <div class="pvp-meta">
          <span class="pvp-name">${esc(myProfile.name)}</span>
          <div class="pvp-score" id="pvp_my_sc">${score}</div>
          <div class="pvp-bar me"><i id="pvp_my_b" style="width:${i/Q.length*100}%"></i></div>
        </div>
      </div>
      <div class="pvp-vs">VS</div>
      <div class="pvp-user opp">
        <div class="pvp-av-hud">${renderAv(oppProfile.av)}</div>
        <div class="pvp-meta">
          <span class="pvp-name">${esc(oppProfile.name)}</span>
          <div class="pvp-score" id="pvp_opp_sc">${oppScore}</div>
          <div class="pvp-bar opp"><i id="pvp_opp_b" style="width:${oppIndex/Q.length*100}%"></i></div>
        </div>
      </div>
    </div>
    <div class="pvp-noti" id="pvp_noti">${oppNoti||"⚔️ Trận đấu đang diễn ra! Đua tốc độ & số câu đúng!"}</div>`;
  }else{
    const mTag=mode==="bede"?`<span class="badge bede" style="margin:0">💅 Bê Đê</span>`:`<span class="badge" style="margin:0">🔥 Sinh Tử</span>`;
    head=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <button class="back" style="margin:0" onclick="setup()">← Đổi phần</button>
      ${mTag}
    </div>
    <div class="top"><span>📝 Câu <b>${i+1}</b>/${Q.length} · ✅ Đúng: <b>${score}</b></span><span>Lần: <b>${tries}</b> · 🏆 <b>${gb()}</b></span></div>
    <div class="bar"><i class="${mode==="bede"?"bede":""}" style="width:${i/Q.length*100}%"></i></div>`;
  }

  if(q.t==="ds"){
    dsSel=[null,null,null,null];
    app.innerHTML=head+`<div class="c"><span class="badge">Đúng / Sai (chọn đủ 4 ý a, b, c, d)</span><p class="q">${fmtQ(q.q)}</p>`+
      q.s.map((st,idx)=>`<div class="ds-item" id="dsi_${idx}"><div class="ds-txt"><b>${"abcd"[idx]})</b> ${esc(st)}</div><div class="ds-btns"><button class="ds-b" id="dsb_${idx}_1" onclick="pickDS(${idx},true)">Đúng</button><button class="ds-b" id="dsb_${idx}_0" onclick="pickDS(${idx},false)">Sai</button></div></div>`).join("")+
      `<button class="go" onclick="subDS()">Nộp đáp án</button><div id="fb"></div></div>`;
  }else if(q.t==="sa"){
    app.innerHTML=head+`<div class="c"><span class="badge">Trả lời ngắn</span><p class="q">${fmtQ(q.q)}</p><div class="sa-wrap"><input class="sa-in" id="sain" type="text" placeholder="Nhập đáp án..." onkeydown="if(event.key==='Enter')subSA()"><button class="sa-btn" onclick="subSA()">Trả lời</button></div><div id="fb"></div></div>`;
    setTimeout(()=>{const el=document.getElementById("sain");if(el)el.focus()},50);
  }else{
    app.innerHTML=head+`<div class="c"><p class="q">${fmtQ(q.q)}</p>${q.o.map((o,j)=>`<button class="o" onclick="pick(${j})"><span class="k">${"ABCD"[j]}</span><span class="ot">${esc(o)}</span></button>`).join("")}<div id="fb"></div></div>`;
  }
}

function pick(j){
  if(lock)return;lock=1;
  const q=Q[i],b=document.querySelectorAll(".o");
  b[q.a].classList.add("ok");
  if(j===q.a) nextOrEnd();
  else{
    b[j].classList.add("no");
    wrongAction(`❌ Sai rồi! Đáp án đúng là: <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b>`);
  }
}
function pickDS(idx,val){
  if(lock)return;
  dsSel[idx]=val;
  document.getElementById(`dsb_${idx}_1`).classList.toggle("sel",val===true);
  document.getElementById(`dsb_${idx}_0`).classList.toggle("sel",val===false);
}
function subDS(){
  if(lock)return;
  if(dsSel.some(v=>v===null)){alert("Vui lòng chọn Đúng hoặc Sai cho cả 4 ý a, b, c, d!");return}
  lock=1;
  const q=Q[i];let allOk=true;
  q.a.forEach((ans,idx)=>{
    const item=document.getElementById(`dsi_${idx}`);
    const corrBtn=document.getElementById(`dsb_${idx}_${ans?1:0}`);
    corrBtn.classList.add("ans");
    if(dsSel[idx]===ans) item.classList.add("ok");
    else{item.classList.add("no");allOk=false}
  });
  if(allOk) nextOrEnd();
  else{
    const keyStr=q.a.map((ans,idx)=>`${"abcd"[idx]}) <b>${ans?"Đúng":"Sai"}</b>`).join(" · ");
    wrongAction(`❌ Chưa chính xác! Đáp án đúng: ${keyStr}`);
  }
}
function normSA(v){return v.trim().replace(/\s+/g,"").replace(/,/g,".").replace(/-/g,"").toLowerCase()}
function subSA(){
  if(lock)return;
  const inp=document.getElementById("sain");
  if(!inp||!inp.value.trim())return;
  lock=1;
  const q=Q[i],u=normSA(inp.value),ans=normSA(q.a);
  if(u===ans){inp.classList.add("ok");nextOrEnd()}
  else{
    inp.classList.add("no");
    wrongAction(`❌ Sai rồi! Đáp án đúng là: <b>${esc(q.a)}</b>${q.h?`<br><small>${esc(q.h)}</small>`:""}`);
  }
}

function end(){
  clearTimeout(tmr);clearInterval(soloBotTmr);
  if(isSolo){
    if(conn&&conn.open) try{conn.send({t:"end",score:score})}catch(e){}
    saveAndBroadcastScore("Solo 1v1",score);
    let resTitle="🤝 HOÀ NHAU!",resImg=imgOk,resColor="#fde047";
    if(score>oppScore){resTitle="🏆 BẠN CHIẾN THẮNG!";resImg=imgOk;resColor="#38bdf8"}
    else if(score<oppScore){resTitle="💀 BẠN THẤT BẠI!";resImg=imgNo;resColor="#ef4444"}
    app.innerHTML=`<div class="c arena" style="text-align:center;padding:24px 16px">
      <h1 style="color:${resColor};margin-bottom:6px;font-size:1.5rem">${resTitle}</h1>
      <img class="r-img" src="${resImg}" alt="Kết quả" onerror="this.style.display='none'">
      <div style="font-size:1.2rem;font-weight:800;margin:14px 0;display:flex;justify-content:center;align-items:center;gap:14px">
        <span style="color:#38bdf8;display:inline-flex;align-items:center;gap:6px">
          <span style="width:28px;height:28px;display:inline-block;border-radius:8px;overflow:hidden">${renderAv(myProfile.av)}</span>
          ${esc(myProfile.name)}: <b>${score}</b>
        </span>
        <span style="color:#64748b">vs</span>
        <span style="color:#ec4899;display:inline-flex;align-items:center;gap:6px">
          <span style="width:28px;height:28px;display:inline-block;border-radius:8px;overflow:hidden">${renderAv(oppProfile.av)}</span>
          ${esc(oppProfile.name)}: <b>${oppScore}</b>
        </span>
      </div>
      <p style="color:#cbd5e1;font-size:.88rem">Tổng số câu đua: <b>${Q.length}</b> câu · Đã cập nhật BXH Real-time!</p>
      <button class="abtn pri" style="width:100%;padding:13px;margin-top:10px" onclick="home()">Quay lại sảnh chính</button>
    </div>`;
  }else{
    saveAndBroadcastScore(S[sub].n,score);
    const pct=Math.round(score/Q.length*100);
    app.innerHTML=`<div class="c" style="text-align:center">
      <h1 class="pg-t">🎉 Hoàn thành bài ôn tập!</h1>
      <img class="r-img" src="${imgOk}" alt="Hoàn thành" onerror="this.style.display='none'">
      <p>${mode==="bede"?`💅 Chế độ Bê Đê: Bạn trả lời đúng <b>${score}/${Q.length}</b> câu (${pct}%).`:`🔥 Chế độ Sinh Tử: Đúng liên tiếp cả <b>${Q.length}</b> câu sau ${tries} lần thử.`}</p>
      <p style="color:#34d399;font-weight:700;font-size:.88rem">⚡ Điểm đã được phát sóng lên Bảng Xếp Hạng Real-time!</p>
      <button class="nx ${mode==="bede"?"bede":""}" onclick="tries=0;start()">Làm lại (xáo trộn mới)</button>
      <div class="chips" style="justify-content:center;margin-top:12px">
        <button class="chip" onclick="setup()">Chọn phần khác</button>
        <button class="chip" onclick="home()">Về trang chủ</button>
      </div>
    </div>`;
  }
}
home();
</script></body></html>
